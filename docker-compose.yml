name: varuna

# Phase A skeleton: redis + ollama + caddy only. The api / ui-public / ui-private
# services are added in later phases as their code lands (IMPLEMENTATION-PLAN §5).
# Only Caddy publishes ports (NFR-11); redis and ollama stay internal to vapt-net (NFR-9).

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # AOF: accounts/agents/audit persist (C-5, NFR-27)
    volumes:
      - redis_data:/data
    networks: [vapt-net]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks: [vapt-net]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VARUNA_DOMAIN=${VARUNA_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [vapt-net]
    restart: unless-stopped

networks:
  vapt-net:
    driver: bridge

volumes:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
