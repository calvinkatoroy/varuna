name: varuna

# Full control-plane stack. Only Caddy (:80/:443) and the private API (bound to the host's
# Tailscale interface) are reachable from outside; redis, ollama, and the API services talk
# over the internal vapt-net (NFR-9, NFR-11, NFR-24). The per-user agent is NOT here; it is a
# native installer that runs on each user's own machine.

x-controlplane: &controlplane
  image: varuna/controlplane:latest
  build:
    context: .
    dockerfile: controlplane/Dockerfile
  working_dir: /app/controlplane/api
  networks: [vapt-net]
  depends_on: [redis]
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # AOF: accounts/agents/audit persist (C-5, NFR-27)
    volumes: [redis_data:/data]
    networks: [vapt-net]
    restart: unless-stopped

  # Ollama runs NATIVE on the host (GPU) for the PoC; the API services reach it via
  # OLLAMA_URL (host.docker.internal). No ollama container here — see .env OLLAMA_URL.

  # Public browser API (JWT). Fronted by Caddy on /api/*.
  api-public:
    <<: *controlplane
    command: uvicorn browser:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - VARUNA_CORS_ORIGINS=${VARUNA_CORS_ORIGINS:-https://localhost}
      - SCAN_TTL_SECONDS=${SCAN_TTL_SECONDS:-86400}
      - REPORTS_DIR=/data/reports
      - VARUNA_DB=/dbdata/varuna.db
    volumes: [report_output:/data/reports, varuna_db:/dbdata]

  # Agent API (per-agent bearer token). Fronted by Caddy on /agent/*.
  api-agent:
    <<: *controlplane
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - SCAN_TTL_SECONDS=${SCAN_TTL_SECONDS:-86400}
      - VARUNA_DB=/dbdata/varuna.db
      - REPORTS_DIR=/data/reports   # ingest generates the v1 review report when findings are ready
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
    volumes: [report_output:/data/reports, varuna_db:/dbdata]

  # Private-plane API (findings/reports/manual). Bound ONLY to the host's Tailscale interface,
  # no public listener (NFR-24). Set TAILSCALE_BIND to the VM's tailscale IP in .env; it
  # defaults to loopback so local dev never exposes it.
  api-private:
    <<: *controlplane
    command: uvicorn private_api:app --host 0.0.0.0 --port 8010
    ports:
      - "${TAILSCALE_BIND:-127.0.0.1}:8010:8010"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - VARUNA_CORS_ORIGINS=${VARUNA_CORS_ORIGINS:-https://localhost}
      - SCAN_TTL_SECONDS=${SCAN_TTL_SECONDS:-86400}
      - REPORTS_DIR=/data/reports
      - VARUNA_DB=/dbdata/varuna.db
    volumes: [report_output:/data/reports, varuna_db:/dbdata]

  # Serves the React SPA and reverse-proxies /api -> api-public, /agent -> api-agent.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        VITE_PRIVATE_API: "${VITE_PRIVATE_API:-http://localhost:8010}"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VARUNA_DOMAIN=${VARUNA_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./agent-dist:/srv/dist:ro
    networks: [vapt-net]
    depends_on: [api-public, api-agent]
    restart: unless-stopped

networks:
  vapt-net:
    driver: bridge

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  report_output:
  varuna_db:
